<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SpeakZone English | Listen & Choose</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#eaf4ff,#f7fbff);font-family:Arial,sans-serif;color:#153457}.wrap{max-width:650px;margin:28px auto;padding:18px}.panel{background:white;border-radius:24px;padding:28px;box-shadow:0 12px 36px #123c7020}header{text-align:center}h1{font-size:28px;margin:7px 0;color:#103d84}.sub{color:#6c819d;font-size:14px}.progress{height:10px;background:#e8eff8;border-radius:20px;overflow:hidden;margin:22px 0}.fill{height:100%;background:#1b79df;width:0;transition:.25s}.top{display:flex;justify-content:space-between;font-weight:bold;color:#456888}.question{background:#eaf4ff;padding:24px;border-radius:18px;text-align:center;margin:18px 0}.question button{background:#1974d2;color:white;border:0;padding:17px 28px;border-radius:14px;font-size:19px;font-weight:800;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.listen{width:100%;border:0;border-radius:15px;background:#103d84;color:white;padding:20px 8px;font-size:19px;font-weight:900;cursor:pointer}.choose{width:100%;border:2px solid #d6e3f3;background:#edf3fa;color:#7187a4;border-radius:14px;padding:17px;font-size:19px;font-weight:600;margin-top:10px;cursor:pointer}.choose:disabled{opacity:.7;cursor:default}.choose.correct{background:#d7f5e4;color:#167346;border-color:#44ba80}.choose.wrong{background:#ffe5e5;color:#a33131;border-color:#e89090}.feedback{text-align:center;min-height:48px;margin-top:18px;font-size:17px;font-weight:700}.next{display:block;margin:0 auto;background:#1675d1;color:white;border:0;border-radius:12px;padding:15px 36px;font-weight:bold;font-size:16px;cursor:pointer}.hidden{display:none}.hint{text-align:center;color:#8294a9;font-size:13px;margin-top:15px}@media(max-width:420px){.panel{padding:18px}.listen{font-size:16px}.wrap{padding:10px}}</style></head><body><div class="wrap"><div class="panel"><header><div style="font-weight:900;letter-spacing:2px;color:#1595ac">SPEAKZONE ENGLISH</div><h1>Listen & Choose</h1><div class="sub">Greetings · Introductions · Conversations</div></header><div id="game"><div class="progress"><div class="fill" id="fill"></div></div><div class="top"><span id="count">Question 1 of 10</span><span id="score">Score: 0 / 10</span></div><div class="question"><div style="font-size:14px;font-weight:bold;margin-bottom:12px;color:#6483a5">LISTEN TO THE PROMPT</div><button onclick="speak(current.prompt)">🔊 LISTEN</button></div><div class="grid"><div><button class="listen" onclick="speak(current.a)">🔊 LISTEN A</button><button id="a" class="choose" onclick="answer('a')">Choose A</button></div><div><button class="listen" onclick="speak(current.b)">🔊 LISTEN B</button><button id="b" class="choose" onclick="answer('b')">Choose B</button></div></div><div class="feedback" id="feedback"></div><button class="next hidden" id="next" onclick="advance()">Next Question →</button><div class="hint">Tap each audio to listen again · American English voice when available</div></div><div id="done" class="hidden" style="text-align:center;padding:30px 0"><h1>Great job! 🎉</h1><h2 id="result"></h2><p>Keep practicing your English!</p><button class="next" onclick="start()">Play Again ↻</button></div></div></div><script>
const pairs=[
{prompt:'Goodbye!',reply:'See you again!',wrong:'Good morning!'},
{prompt:'See you later!',reply:'Bye!',wrong:'Nice to meet you, too.'},
{prompt:'Good morning!',reply:'Good morning!',wrong:'Good night!'},

{prompt:'Hello!',reply:'Hi!',wrong:'See you later!'},

];let deck=[],idx=0,points=0,current=null,selected=false;function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function start(){deck=shuffle(pairs.map(p=>({...p,flip:Math.random()<.5})));idx=0;points=0;document.getElementById('game').classList.remove('hidden');document.getElementById('done').classList.add('hidden');render()}function render(){selected=false;const p=deck[idx];current={prompt:p.prompt,a:p.flip?p.wrong:p.reply,b:p.flip?p.reply:p.wrong,correct:p.flip?'b':'a',reply:p.reply};document.getElementById('count').textContent=`Question ${idx+1} of 10`;document.getElementById('score').textContent=`Score: ${points} / 10`;document.getElementById('fill').style.width=`${idx*10}%`;for(const k of ['a','b']){const el=document.getElementById(k);el.disabled=false;el.className='choose'}document.getElementById('feedback').textContent='';document.getElementById('next').classList.add('hidden')}function answer(k){if(selected)return;selected=true;const ok=k===current.correct;if(ok)points++;document.getElementById(k).classList.add(ok?'correct':'wrong');document.getElementById(current.correct).classList.add('correct');for(const x of ['a','b'])document.getElementById(x).disabled=true;document.getElementById('feedback').textContent=ok?'✓ Correct! Great listening!':`Not quite! Correct answer: ${current.correct.toUpperCase()}`;document.getElementById('score').textContent=`Score: ${points} / 10`;const btn=document.getElementById('next');btn.textContent=idx===9?'See Results →':'Next Question →';btn.classList.remove('hidden')}function advance(){idx++;if(idx>=10){document.getElementById('game').classList.add('hidden');document.getElementById('done').classList.remove('hidden');document.getElementById('result').textContent=`Your score: ${points} / 10`;return}render()}function speak(t){if(!('speechSynthesis'in window)){alert('Speech is not supported by this browser.');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.85;const voices=speechSynthesis.getVoices();const v=voices.find(x=>x.lang==='en-US'&&/natural|premium|samantha|google us/i.test(x.name))||voices.find(x=>x.lang==='en-US');if(v)u.voice=v;speechSynthesis.speak(u)}start();</script></body></html>
