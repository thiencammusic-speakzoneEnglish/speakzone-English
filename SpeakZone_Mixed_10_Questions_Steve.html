<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SpeakZone English | Listen & Choose</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#e8f5ff,#fff4df);font-family:Arial,sans-serif;color:#17324d;min-height:100vh;display:grid;place-items:center;padding:20px}.app{width:min(620px,100%);background:white;border-radius:26px;padding:30px;box-shadow:0 18px 55px #20405b25}.brand{font-weight:900;color:#117c9a;letter-spacing:1px}.tag{font-size:12px;background:#e8f7f2;border-radius:30px;padding:7px 12px;display:inline-block;margin-top:8px}h1{margin:12px 0 5px;font-size:29px}.muted{color:#60788c}.top{display:flex;justify-content:space-between;margin-top:20px;font-weight:700}.bar{height:10px;background:#e9eff5;border-radius:9px;margin:10px 0 25px;overflow:hidden}.fill{height:100%;background:#25b69d;transition:width .3s}.prompt{background:#edf8ff;padding:20px;border-radius:20px;text-align:center}.prompt p{font-size:14px;margin:0 0 14px}.play{border:0;border-radius:15px;background:#176cbd;color:white;font-size:17px;font-weight:bold;padding:16px 22px;cursor:pointer;width:100%}.choices{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}.choice{border:2px solid #dce6f0;border-radius:19px;padding:16px;text-align:center}.choice strong{display:block;font-size:22px;margin-bottom:13px}.audio{width:100%;padding:13px 5px;background:#f1f6fc;border:0;border-radius:12px;font-weight:900;color:#083c68;cursor:pointer;font-size:19px;box-shadow:0 3px 0 #c5d9ed}.audio:hover{background:#dceeff}.audio-label{font-weight:900;letter-spacing:.3px}.select{width:100%;margin-top:12px;background:white;border:2px solid #117c9a;border-radius:12px;padding:12px;font-size:16px;font-weight:bold;color:#117c9a;cursor:pointer}.select:disabled{opacity:.55;cursor:default}.choice.correct{border-color:#18a77a;background:#edfff7}.choice.wrong{border-color:#e96b6b;background:#fff1f1}.feedback{min-height:52px;text-align:center;font-weight:700;margin-top:16px}.next{width:100%;padding:15px;background:#ffb02e;border:0;border-radius:13px;font-size:17px;font-weight:bold;cursor:pointer}.next:disabled{opacity:.4}.footer{text-align:center;font-size:12px;color:#81909b;margin-top:18px}.end{text-align:center;padding:30px 0}.end .big{font-size:65px}.hidden{display:none}@media(max-width:440px){.app{padding:20px}.choices{gap:9px}.choice{padding:10px}h1{font-size:25px}}</style></head><body><main class="app"><div class="brand">SPEAKZONE ENGLISH</div><span class="tag">BEGINNER · GREETINGS & CONVERSATION</span><h1>🎧 Listen & Choose</h1><div id="game"><div class="muted">Listen to the question and choose the best reply.</div><div class="top"><span id="count">Question 1 of 10</span><span id="score">⭐ 0 points</span></div><div class="bar"><div id="fill" class="fill"></div></div><div class="prompt"><p>🔊 Listen to the question</p><button class="play" onclick="speak(current.q)">▶ Play Question</button></div><div class="choices"><div class="choice" id="ca"><strong>A</strong><button class="audio" onclick="speak(current.a)">🔊 <span class="audio-label">Audio A</span></button><button class="select" onclick="answer('a')">Choose A</button></div><div class="choice" id="cb"><strong>B</strong><button class="audio" onclick="speak(current.b)">🔊 <span class="audio-label">Audio B</span></button><button class="select" onclick="answer('b')">Choose B</button></div></div><div id="feedback" class="feedback" aria-live="polite"></div><button id="next" class="next" disabled onclick="advance()">Next Question →</button></div><div id="end" class="end hidden"><div class="big">🏆</div><h1>Great job!</h1><h2 id="final"></h2><p class="muted">Keep practicing your English!</p><button class="play" onclick="restart()">↻ Play Again</button></div><div class="footer">SpeakZone English · Practice makes progress</div></main><script>
const questions=[
{q:"What's your name?",a:"My name is Steve.",b:"Good night!",correct:'a'},
{q:"Hi!",a:"Good night!",b:"Hello!",correct:'b'},
{q:"How do you spell your name?",a:"S-T-E-V-E. Steve.",b:"I'm good. How about you?",correct:'a'},
{q:"Good morning!",a:"Good evening!",b:"Good morning!",correct:'b'},
{q:"S-T-E-V-E. Steve.",a:"I'm sorry. Can you say that again, please?",b:"Nice to meet you, too.",correct:'a'},
{q:"Hello, Steve!",a:"Goodbye!",b:"Hi!",correct:'b'},
{q:"How are you today?",a:"I'm good. How about you?",b:"My name is Steve.",correct:'a'},
{q:"Good afternoon!",a:"Good night!",b:"Good afternoon!",correct:'b'},
{q:"Nice to meet you.",a:"Nice to meet you, too.",b:"S-T-E-V-E.",correct:'a'},
{q:"Good night!",a:"Good morning!",b:"Good night!",correct:'b'}];
let i=0,points=0,locked=false,current=questions[0];let voices=[];function loadVoices(){if('speechSynthesis'in window)voices=speechSynthesis.getVoices()}if('speechSynthesis'in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}function speak(t){if(!('speechSynthesis'in window)){alert('Audio is not supported by this browser.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.86;u.pitch=1;let us=voices.filter(v=>v.lang.toLowerCase().startsWith('en-us'));u.voice=us.find(v=>/natural|premium|samantha|google us english/i.test(v.name))||us[0]||null;speechSynthesis.speak(u)}function render(){current=questions[i];locked=false;document.getElementById('count').textContent=`Question ${i+1} of ${questions.length}`;document.getElementById('score').textContent=`⭐ ${points} points`;document.getElementById('fill').style.width=`${i/questions.length*100}%`;document.getElementById('feedback').textContent='';document.getElementById('next').disabled=true;for(let k of ['a','b']){document.getElementById('c'+k).className='choice';document.querySelector('#c'+k+' .select').disabled=false}}function answer(k){if(locked)return;locked=true;let good=k===current.correct;if(good)points++;document.getElementById('score').textContent=`⭐ ${points} points`;document.getElementById('feedback').textContent=good?'✅ Correct! Well done!':'❌ Not quite. Listen to the correct answer!';document.getElementById('feedback').style.color=good?'#128b68':'#d14c4c';document.getElementById('c'+current.correct).classList.add('correct');if(!good)document.getElementById('c'+k).classList.add('wrong');document.querySelectorAll('.select').forEach(x=>x.disabled=true);document.getElementById('next').disabled=false;document.getElementById('next').textContent=i===questions.length-1?'See Results →':'Next Question →'}function advance(){speechSynthesis?.cancel();i++;if(i===questions.length){document.getElementById('game').classList.add('hidden');document.getElementById('end').classList.remove('hidden');document.getElementById('final').textContent=`Your score: ${points} / ${questions.length}`;return}render()}function restart(){i=0;points=0;document.getElementById('end').classList.add('hidden');document.getElementById('game').classList.remove('hidden');render()}render();
</script></body></html>
